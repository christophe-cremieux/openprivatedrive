{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary display-4"></i>
                    <h2 class="fw-bold mt-2">Reset Password</h2>
                    <p class="text-muted">Choose a new secure password for your account.</p>
                </div>

                <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light" id="new_password" name="new_password" required minlength="12" placeholder="At least 12 characters">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light" id="confirm_password" name="confirm_password" required minlength="12" placeholder="Repeat password">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-3 rounded-3 fw-bold shadow-sm">
                            Reset Password
                        </button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
