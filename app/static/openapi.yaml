openapi: 3.0.0
info:
  title: Private Drive API
  description: REST API for Private Drive Android app and web clients.
  version: 1.0.0
servers:
  - url: /api/v1
    description: v1 Base URL

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string

    User:
      type: object
      properties:
        uuid:
          type: string
        username:
          type: string
        email:
          type: string
        storage_quota_bytes:
          type: integer

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    ResourceItem:
      type: object
      properties:
        uuid:
          type: string
        type:
          type: string
          enum: [file, folder]
        name:
          type: string
        size:
          type: integer
        mime_type:
          type: string
        parent_uuid:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner:
          type: string
        permission:
          type: string
        is_starred:
          type: boolean
        download_url:
          type: string
          nullable: true
        previewable:
          type: boolean
        preview_type:
          type: string
          enum: [image, pdf, text, csv, video, audio, office_pdf, office_pending, office_failed, office_none, encrypted, none]
        preview_url:
          type: string
          nullable: true
        thumbnail_status:
          type: string
        thumbnail_small_url:
          type: string
          nullable: true
        thumbnail_large_url:
          type: string
          nullable: true
        is_encrypted:
          type: boolean
        searchable_content:
          type: boolean
        requires_password_for_download:
          type: boolean
        encrypt_new_uploads:
          type: boolean
          description: "For folders: policy to encrypt new uploads"

    Pagination:
      type: object
      properties:
        total: {type: integer}
        pages: {type: integer}
        current_page: {type: integer}
        per_page: {type: integer}
        has_next: {type: boolean}
        has_prev: {type: boolean}

    Device:
      type: object
      properties:
        uuid: {type: string}
        device_id: {type: string}
        device_name: {type: string}
        last_used_at: {type: string, format: date-time}

paths:
  /capabilities:
    get:
      summary: Get server capabilities and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      max_upload_size_mb: {type: integer}
                      storage_used_bytes: {type: integer}
                      storage_limit_bytes: {type: integer}
                      allowed_extensions: {type: array, items: {type: string}}
                      preview_types: {type: array, items: {type: string}}
                      encryption_supported: {type: boolean}
                      resumable_upload_supported: {type: boolean}
                      resumable_encrypted_upload_supported: {type: boolean}
                      quarantine_scan_enabled: {type: boolean}
                      office_preview_enabled: {type: boolean}
                      office_preview_max_mb: {type: integer}
                      max_chunk_size: {type: integer}
                      encryption_min_password_length: {type: integer}
                      thumbnail_sizes: {type: array, items: {type: string}}
                      unsupported_encrypted_features: {type: array, items: {type: string}}
                      public_link_encrypted_supported: {type: boolean}

  /auth/login:
    post:
      summary: Login and get tokens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
                device_id: {type: string}
                device_name: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/logout:
    post:
      summary: Logout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: {type: string}
      responses:
        '200':
          description: OK

  /me:
    get:
      summary: Get current user info
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: { $ref: '#/components/schemas/User' }

  /trash:
    get:
      summary: List items in trash
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid: {type: string}
                        type: {type: string}
                        name: {type: string}
                        deleted_at: {type: string, format: date-time}

  /trash/empty:
    post:
      summary: Empty trash
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK

  /folders/{uuid}/restore:
    post:
      summary: Restore folder from trash
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /files/{uuid}/restore:
    post:
      summary: Restore file from trash
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /folders/root:
    get:
      summary: Get root folder info
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK

  /folders/{uuid}/path:
    get:
      summary: Get folder ancestry path
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid: {type: string}
                        name: {type: string}
                        is_root: {type: boolean}

  /folders:
    post:
      summary: Create folder
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                parent_uuid: {type: string}
      responses:
        '201':
          description: Created

  /folders/{uuid}/move:
    post:
      summary: Move folder
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [destination_uuid]
              properties:
                destination_uuid: {type: string}
      responses:
        '200':
          description: OK

  /folders/{uuid}/copy:
    post:
      summary: Copy folder
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [destination_uuid]
              properties:
                destination_uuid: {type: string}
      responses:
        '201':
          description: Created

  /folders/{uuid}:
    get:
      summary: Get folder contents
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer}
        - name: per_page
          in: query
          schema: {type: integer}
        - name: sort
          in: query
          schema: {type: string, enum: [name, date, size]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      uuid: {type: string}
                      name: {type: string}
                      parent_uuid: {type: string, nullable: true}
                      encrypt_new_uploads: {type: boolean}
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResourceItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
    patch:
      summary: Update folder (Rename/Policy)
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                encrypt_new_uploads: {type: boolean}
      responses:
        '200':
          description: OK
    delete:
      summary: Delete folder
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
        - name: permanent
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: OK

  /folders/{uuid}/star:
    post:
      summary: Toggle folder star status
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /files/{uuid}/move:
    post:
      summary: Move file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [destination_uuid]
              properties:
                destination_uuid: {type: string}
      responses:
        '200':
          description: OK

  /files/{uuid}/copy:
    post:
      summary: Copy file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [destination_uuid]
              properties:
                destination_uuid: {type: string}
      responses:
        '201':
          description: Created

  /files/upload:
    post:
      summary: Upload file (Multipart/Bulk/Directory)
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                folder_uuid:
                  type: string
                  description: UUID of the parent folder
                custom_name:
                  type: string
                  description: Custom name for single file upload
                prefix:
                  type: string
                  description: Prefix for bulk upload sequential naming
                relative_paths[]:
                  type: array
                  items:
                    type: string
                  description: Relative paths for directory upload
                is_encrypted:
                  type: boolean
                  description: Whether to encrypt the uploaded file(s)
                password:
                  type: string
                  description: Password for encryption
      responses:
        '201':
          description: Created

  /files/{uuid}:
    get:
      summary: Get file metadata
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    $ref: '#/components/schemas/ResourceItem'
    patch:
      summary: Rename file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        '200':
          description: OK
    delete:
      summary: Delete file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
        - name: permanent
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: OK

  /files/{uuid}/download:
    get:
      summary: Download file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /files/{uuid}/decrypt-download:
    post:
      summary: Decrypt and download file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
      responses:
        '200':
          description: Decrypted file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /files/{uuid}/star:
    post:
      summary: Toggle file star status
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /files/{uuid}/preview:
    get:
      summary: Preview file
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: File preview stream

  /files/{uuid}/thumbnail:
    get:
      summary: Get file thumbnail
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
        - name: size
          in: query
          schema: {type: string, enum: [small, large], default: small}
      responses:
        '200':
          description: Thumbnail image stream

  /files/{uuid}/office-preview:
    get:
      summary: Get Office document PDF preview
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /uploads/session:
    post:
      summary: Start resumable upload
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [filename, total_size, total_chunks, sha256]
              properties:
                filename: {type: string}
                total_size: {type: integer}
                total_chunks: {type: integer}
                sha256: {type: string}
                folder_uuid: {type: string}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      session_uuid: {type: string}

  /uploads/session/{uuid}:
    get:
      summary: Get upload session status
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
    delete:
      summary: Cancel upload session
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /uploads/session/{uuid}/chunks/{index}:
    put:
      summary: Upload chunk
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
        - name: index
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK

  /uploads/session/{uuid}/complete:
    post:
      summary: Finalize resumable upload
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '201':
          description: Created

  /share:
    post:
      summary: Share a resource
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_uuid, username, permission]
              properties:
                resource_type: {type: string, enum: [file, folder]}
                resource_uuid: {type: string}
                username: {type: string}
                permission: {type: string, enum: [viewer, editor, manager]}
      responses:
        '201':
          description: Created

  /shares:
    get:
      summary: List shares for a resource
      security:
        - BearerAuth: []
      parameters:
        - name: resource_type
          in: query
          required: true
          schema: {type: string, enum: [file, folder]}
        - name: resource_uuid
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /share/{uuid}:
    patch:
      summary: Update share permission
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: {type: string, enum: [viewer, editor, manager]}
      responses:
        '200':
          description: OK
    delete:
      summary: Remove share
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /shared-with-me:
    get:
      summary: List items shared with the user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK

  /public-links:
    get:
      summary: List user's public links
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: Create a public link
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_uuid]
              properties:
                resource_type: {type: string, enum: [file, folder]}
                resource_uuid: {type: string}
                password: {type: string}
                one_time_use: {type: boolean}
                expires_in_days: {type: integer}
                max_downloads: {type: integer}
                link_type: {type: string, enum: [download, upload]}
                max_files: {type: integer}
                max_upload_size_mb: {type: integer}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      token: {type: string}
                      uuid: {type: string}

  /public-links/{uuid}:
    delete:
      summary: Delete a public link
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /devices:
    get:
      summary: List active devices/sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'

  /devices/{uuid}:
    delete:
      summary: Revoke device session
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK

  /starred:
    get:
      summary: List starred items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK

  /recent:
    get:
      summary: List recent files
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK

  /search:
    get:
      summary: Search files and folders
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - name: owner
          in: query
          schema: {type: string}
        - name: starred
          in: query
          schema: {type: boolean}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: OK

  /sync/changes:
    get:
      summary: Fetch incremental updates
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string}
        - name: per_page
          in: query
          schema: {type: integer, default: 100}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      changes:
                        type: array
                        items:
                          type: object
                      next_cursor: {type: string}
                      has_more: {type: boolean}
