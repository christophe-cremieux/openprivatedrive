services:
  app:
    build: .
    container_name: private-drive
    ports:
      - "5350:5100"
    volumes:
      - ./data/instance:/app/instance
      - ./data/storage:/app/storage
      - ./data/logs:/app/logs
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - DATABASE_URL=sqlite:////app/instance/app.db
      - STORAGE_PATH=/app/storage
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - RATELIMIT_STORAGE_URI=memory://
      - SIMPLE_DOCKER_DEPLOYMENT=True
      - ANTIVIRUS_ENABLED=${ANTIVIRUS_ENABLED:-False}
      - CLAMD_HOST=${CLAMD_HOST:-clamav}
      - CLAMD_PORT=${CLAMD_PORT:-3310}
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: private-drive-clamav
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  clamav-data:
